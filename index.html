<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ASV Chess Tracker</title>
    <link rel="stylesheet" href="style.css?v=22">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/hammerjs@2.0.8"></script>
    <script src="https://cdn.jsdelivr.net/npm/chartjs-plugin-zoom@2.2.0/dist/chartjs-plugin-zoom.min.js"></script>
    <script>Chart.register(ChartZoom);</script>
</head>

<body>
    <div class="container">
        <h2>ASV Player Dashboard</h2>
        <div class="dashboard-layout">
            
            <!-- Left Panel: Directory -->
            <div class="panel-left">
                <div class="directory-header">
                    <h3>Club Directory</h3>
                    <input type="text" id="directorySearch" class="search-input" placeholder="Filter players...">
                </div>
                <div class="directory-table-container">
                    <table>
                        <thead class="table-header-sticky">
                            <tr>
                                <th>#</th>
                                <th id="sortNameBtn" style="cursor: pointer;">Player ↕</th>
                                <th id="sortEloBtn" style="cursor: pointer;">ELO ↕</th>
                            </tr>
                        </thead>
                        <tbody id="topEloBody"></tbody>
                    </table>
                </div>
                <button type="button" id="clearSelectionBtn" class="btn-clear" style="display:none;">Clear selection</button>
            </div>

            <!-- Right Panel: Chart and Match History -->
            <div class="panel-right">
                <div id="savedViewsContainer" class="saved-views" role="group" aria-label="Saved views">
                    <span class="saved-views-label" aria-hidden="true">Saved</span>
                    <div id="savedViewsList" class="saved-views-list" aria-live="polite"></div>
                    <button type="button" id="saveSavedViewBtn" class="saved-view-save" data-action="save-view" aria-label="Save current player selection" title="Save current player selection" disabled>+</button>
                </div>

                <div id="emptyState" class="empty-state">
                    <div class="empty-icon">📊</div>
                    <h3 class="empty-title">No players selected</h3>
                    <p class="empty-text">Click on players in the directory to compare their ELO history and view matches.</p>
                </div>

                <div id="chartContainer" class="chart-container" style="display: none;">
                    <div class="chart-toolbar">
                        <div id="playerChipsContainer" class="chips-container"></div>
                        <div class="controls-group">
                            <select id="timeFilter" class="filter-select">
                                <option value="all">All time</option>
                                <option value="1">Last month</option>
                                <option value="3">Last 3 months</option>
                                <option value="12">Last year</option>
                            </select>
                            <button type="button" id="maximizeChartBtn" class="btn-outline">⛶ Maximize</button>
                        </div>
                    </div>

                    <div id="playerStatsContainer" class="stats-container" style="display: none;"></div>
                    <div class="chart-canvas-container">
                        <canvas id="eloChart"></canvas>
                    </div>
                </div>

                <div id="historyContainer" style="display: none;">
                    <h3 class="history-title">Match History</h3>
                    <table>
                        <thead>
                            <tr>
                                <th>Date</th>
                                <th>White</th>
                                <th>Black</th>
                                <th>Result</th>
                            </tr>
                        </thead>
                        <tbody id="matchHistoryBody"></tbody>
                    </table>
                </div>
            </div>
        </div>
    </div>
    
    <script type="module" src="app.js?v=20"></script>
    
    <!-- Modal -->
    <div id="chartModal" class="modal-overlay" style="display: none;">
        <div class="modal-content">
            <button type="button" id="closeModalBtn" class="btn-close" aria-label="Close maximized chart" title="Close maximized chart">&times;</button>
            <div class="modal-header">
                <div id="modalChipsContainer" class="chips-container"></div>
                <div class="controls-group">
                    <select id="modalTimeFilter" class="filter-select">
                        <option value="all">All time</option>
                        <option value="1">Last month</option>
                        <option value="3">Last 3 months</option>
                        <option value="12">Last year</option>
                    </select>
                    <button type="button" id="resetModalZoomBtn" class="btn-outline">Reset zoom</button>
                </div>
            </div>
            <div class="modal-body">
                <div id="modalStatsContainer" class="stats-container" style="display: none;"></div>
                <div class="modal-chart-container">
                    <canvas id="modalEloChart"></canvas>
                </div>
            </div>
        </div>
    </div>

    <!-- ========================================== -->
    <!-- TEMPLATES FOR VANILLA JS (Zero innerHTML) -->
    <!-- ========================================== -->
    
    <template id="tpl-directory-row">
        <tr class="directory-row">
            <td></td>
            <td><span class="clickable-player link-style" data-action="select-player"></span></td>
            <td></td>
        </tr>
    </template>

    <template id="tpl-player-chip">
        <div class="player-chip">
            <span class="chip-name"></span>
            <span class="chip-elo"></span>
            <button type="button" class="chip-close" data-action="select-player">&times;</button>
        </div>
    </template>

    <template id="tpl-stats-single">
        <div class="stat-box"><strong>🏆 Win Rate:</strong> <span class="stat-winrate"></span></div>
        <div class="stat-box"><strong>🔥 Best Win:</strong> <span class="stat-bestwin"></span></div>
        <div class="stat-box"><strong>⚔️ Rival:</strong> <span class="stat-rival"></span></div>
        <div class="stat-box"><strong>♟️ Total Games:</strong> <span class="stat-total"></span></div>
        <div><strong>Form (Last 5):</strong> <span class="stat-streak"></span></div>
    </template>

    <template id="tpl-stats-h2h">
        <div class="h2h-stats">
            <!-- Header -->
            <div class="h2h-header">
                ⚔️ <strong>Head-to-Head</strong> <span class="h2h-draws text-muted"></span>
            </div>
            <!-- Scoreboard -->
            <div class="h2h-scoreboard">
                <!-- Player 1 -->
                <div class="h2h-player">
                    <div class="h2h-p1-name h2h-player-name text-bold"></div>
                    <div class="h2h-score-p1 h2h-score"></div>
                    <div class="h2h-p1-streak"></div>
                </div>
                <div class="h2h-vs">VS</div>
                <!-- Player 2 -->
                <div class="h2h-player">
                    <div class="h2h-p2-name h2h-player-name text-bold"></div>
                    <div class="h2h-score-p2 h2h-score"></div>
                    <div class="h2h-p2-streak"></div>
                </div>
            </div>
        </div>
    </template>

    <template id="tpl-history-row">
        <tr class="history-row">
            <td class="history-cell col-date"></td>
            <td class="history-cell col-white"><span class="clickable-player" data-action="select-player"></span></td>
            <td class="history-cell col-black"><span class="clickable-player" data-action="select-player"></span></td>
            <td class="history-cell col-result"></td>
        </tr>
    </template>

</body>
</html>
